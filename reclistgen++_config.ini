[GENERAL]
max_syllables_per_sentence = 8
mode = vccv-cvvc
separator_format = R-dash
oto_sort = category
merge_short_entries = true
generation_mode = sequence
first_sound = consonant
ensure_coda_r = true
ensure_vowel_link = true
ensure_all_syllables_forced = true
ensure_all_syllables_standard = false

[OTO]
bpm = 120
leading_silence = 100
max_alternatives = 0
use_consonant_for_first_syllable = false
generate_coda_consonant = false
generate_coda_onset = false
generate_onset_consonant = false
generate_onset = true

[PHONEME]
semi_vowels = v,w,y

[OPTIONS]
prioritize_semi_vowels = true
prioritize_vowel_transitions = true
transition_generation = all
unique_entry_strategy = replace
first_onset_as_normal = false
redundancy_mode = active_removal
global_sort_reclist = global

